name: 4-Hour Ingestion

on:
  schedule:
    - cron: '0 */4 * * *' # Triggers every 4 hours
  workflow_dispatch:      # Adds a "Run" button for testing

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install tweepy psycopg2-binary
      - name: Execute script
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python x_collector.py
